<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Vue Klasha Example</title>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css" integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
    <!-- Vue 2 -->
    <script src="https://unpkg.com/vue@2/dist/vue.js"></script>
    <!-- vue-klasha (UMD build) -->
    <script src="../dist/klasha.min.js"></script>
    <style>
    body {
        font-size: 1em;
        font-family: 'Tahoma', sans-serif;
    }
    .klashaPayButtonStyle {
        background-color: #4CAF50;
        border-radius: 20px;
        border: 0;
        color: white;
        cursor: pointer;
        padding: 15px 32px;
        font-size: 16px;
    }
    </style>
</head>

<body>
    <div id="app">
        <klasha
          :is-test-mode="isTestMode"
          :email="email"
          :phone-number="phoneNumber"
          :merchant-key="merchantKey"
          :amount="amount"
          :source-currency="sourceCurrency"
          :destination-currency="destinationCurrency"
          :tx-ref="txRef"
          :business-id="businessId"
          :fullname="fullname"
          :payment-type="paymentType"
          :payment-description="paymentDescription"
          :call-back="callBack"
          :embed="false"
          @error="onError"
        >
            <i class="fas fa-money-bill-alt"></i>
            Make Payment
        </klasha>
    </div>

    <script type="text/javascript">
    new Vue({
        el: '#app',
        components: {
            // The UMD bundle exposes the component as VueKlasha.default
            klasha: VueKlasha.default
        },
        data: function () {
            return {
                // true  -> Klasha sandbox
                // false -> LIVE gateway, real money
                isTestMode: true,
                email: 'buyer@example.com',
                phoneNumber: '+2348159991635',
                // Replace with your own key from the Klasha dashboard.
                merchantKey: 'YOUR_TEST_MERCHANT_KEY',
                amount: 1000,
                sourceCurrency: 'NGN',
                destinationCurrency: 'NGN',
                txRef: 'DEMO-' + Date.now(),
                businessId: '1',
                fullname: 'Ada Lovelace',
                paymentDescription: '',
                paymentType: ''
            };
        },
        methods: {
            callBack: function (response) {
                window.alert('Klasha response: ' + JSON.stringify(response));
            },
            onError: function (error) {
                window.alert('Klasha error: ' + error.message);
            }
        }
    });
    </script>
</body>

</html>
